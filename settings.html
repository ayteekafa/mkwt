function makeClient(storage){
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth:{ storage, persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
}

const clientLocal = makeClient(localStorage);
const clientSess  = makeClient(sessionStorage);
let supabaseClient = null;
let SESSION = null;

const $ = id => document.getElementById(id);
const status = $("status");
function setStatus(t){ status.textContent = t }


// ========= Theme (local setting, affects the whole UI) =========
function applyThemeValue(t){
  try{
    document.documentElement.dataset.theme = (t && String(t).trim()) ? String(t).trim() : "dark";
  }catch(e){}
}
function loadThemeSetting(){
  try{
    const t = localStorage.getItem("mkwt_theme") || "dark";
    const sel = $("settingsTheme");
    if (sel) sel.value = t;
    applyThemeValue(t);
  }catch(e){
    applyThemeValue("dark");
  }
}
function saveThemeSetting(){
  try{
    const sel = $("settingsTheme");
    const t = (sel && sel.value) ? sel.value : "dark";
    localStorage.setItem("mkwt_theme", t);
    applyThemeValue(t);
  }catch(e){}
}

// ========= Min-VR Filter (local setting, affects stats/sessions) =========
function loadMinVrSetting(){
  try{
    const v = parseInt(localStorage.getItem("mkwt_min_vr_filter") || "0", 10);
    $("settingsMinVr").value = (Number.isFinite(v) && v > 0) ? String(v) : "";
  }catch(e){
    try{ $("settingsMinVr").value = ""; }catch{}
  }
}

function saveMinVrSetting(){
  try{
    const raw = String($("settingsMinVr").value || "").trim();
    const v = raw === "" ? 0 : parseInt(raw, 10);
    const ok = Number.isFinite(v) && v > 0 ? v : 0;
    localStorage.setItem("mkwt_min_vr_filter", String(ok));
    return ok;
  }catch(e){
    return 0;
  }
}

// ========= Small reusable Info Modal (no external libs) =========
const INFO_TEXT = {
  minVrFilter:
    "This filter removes low-VR outliers from your stats. Any match where your VR total before OR after the game is below the threshold will be excluded from charts and averages. Use this to ignore early games (e.g. Nintendo starting VR) where gains can be extremely high and skew the data. Set it to 0 (or empty) to disable the filter."
  ,
  theme:
    "Choose a visual style for the whole app. Dark matches the current black look, Light uses a soft off-white background, Dendo (Blue) highlights the blue accent, Green adds a subtle green primary, and Red switches the primary accent to red. Changes apply after you press Save. Your choice is stored locally and used across tracker, stats, sessions, and settings."
};

function openInfo(id){
  const overlay = $("infoOverlay");
  const body = $("infoBody");
  const title = $("infoTitle");
  if (!overlay || !body) return;
  title.textContent = "Info";
  body.textContent = INFO_TEXT[id] || "";
  overlay.hidden = false;
  overlay.style.display = "flex";
}

function closeInfo(){
  const overlay = $("infoOverlay");
  if (!overlay) return;
  overlay.hidden = true;
  overlay.style.display = "none";
}

// Close: X button + outside tap
document.addEventListener("DOMContentLoaded", ()=>{
  const overlay = $("infoOverlay");
  const closeBtn = $("infoClose");
  closeBtn?.addEventListener("click", closeInfo);

  // Open only when the actual info icon is clicked/tapped.
  // (Prevents mobile Safari label/tap forwarding to the button.)
  document.querySelectorAll('.mcard__infoBtn[data-info]').forEach((btn)=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      openInfo(btn.dataset.info);
    });
    // Safety: ignore touchend bubbling from surrounding elements
    btn.addEventListener('touchend', (e)=>{
      e.preventDefault();
      e.stopPropagation();
    }, {passive:false});
  });

  overlay?.addEventListener("click", (e)=>{
    if (e.target === overlay) closeInfo();
  });
});

/* ========= AUTH ========= */
async function requireAuth(){
  let { data:{session} } = await clientLocal.auth.getSession();
  if(session){ supabaseClient=clientLocal; SESSION=session; window.supabaseClient=supabaseClient; window.SESSION=SESSION; return }

  ({ data:{session} } = await clientSess.auth.getSession());
  if(session){ supabaseClient=clientSess; SESSION=session; window.supabaseClient=supabaseClient; window.SESSION=SESSION; return }

  window.supabaseClient=null; window.SESSION=null; location.href="login.html";
}

/* ========= PROFILE ========= */
async function loadProfile(){
  if(!SESSION?.user?.id){
    setStatus("Not logged in");
    return;
  }

  // Prefer profiles.id (most common in your project). If that column doesn't exist, fallback to profiles.user_id.
  let { data, error } = await supabaseClient
    .from("profiles")
    .select("nickname,current_vr")
    .eq("id", SESSION.user.id)
    .maybeSingle();

  if (error && String(error.message || "").includes("column profiles.id")) {
    ({ data, error } = await supabaseClient
      .from("profiles")
      .select("nickname,current_vr")
      .eq("user_id", SESSION.user.id)
      .maybeSingle());
  }

  if(error){ setStatus(error.message); return }

  $("settingsNickname").value = data?.nickname || "";
  $("settingsVr").value = (data?.current_vr ?? "");
}


async function saveSettings(){
  // Apply + save local UI settings only when Save is pressed
  saveThemeSetting();
  const minVr = saveMinVrSetting();

  const nickname = $("settingsNickname").value.trim();
  const vr = parseInt($("settingsVr").value,10);

  // Allow saving the filter even if nickname/VR are not filled.
  if(!nickname || !Number.isFinite(vr)){
    setStatus(`✅ Saved locally${minVr>0 ? ` (Min VR: ${minVr})` : " (Min VR: disabled)"}.`);
    return;
  }

  const payload = {
    id: SESSION.user.id,          // primary key in your current schema
    nickname,
    current_vr: vr,
    updated_at: new Date().toISOString()
  };

  // Prefer upsert so it works whether the row exists or not.
  let { error } = await supabaseClient
    .from("profiles")
    .upsert(payload);

  // Fallback if this project uses profiles.user_id instead of profiles.id
  if (error && String(error.message || "").includes("column profiles.id")) {
    ({ error } = await supabaseClient
      .from("profiles")
      .upsert({ user_id: SESSION.user.id, nickname, current_vr: vr, updated_at: new Date().toISOString() }));
  }

  if(error){ setStatus(error.message); return }

  setStatus(`✅ Saved${minVr>0 ? ` (Min VR: ${minVr})` : ""}`);
}


/* ========= NAV ACTIONS ========= */
// Nav actions (Export / Import / Logout) are wired by the shared nav script at the bottom.

/* ========= INIT ========= */
$("btnSaveSettings").onclick = saveSettings;

(async()=>{
  await requireAuth();
  await loadProfile();
  loadMinVrSetting();
  loadThemeSetting();
})();
</script>

<!-- MKWT Shared Nav Actions -->
<script>
(function(){
  const $id = (id)=>document.getElementById(id);

  async function ensureSession(){
    try{
      if (window.SESSION && window.SESSION.user) return;
      if (!window.supabaseClient?.auth?.getSession) return;
      const { data } = await supabaseClient.auth.getSession();
      window.SESSION = data?.session || null;
    }catch(e){ console.warn(e); }
  }

  async function ensureProfile(){
    try{
      if (typeof window.loadProfile === "function") { await window.loadProfile(); return; }
      if (!window.supabaseClient || !window.SESSION?.user) return;
      // Prefer profiles.id. Only try profiles.user_id if that column exists.
      let { data, error } = await supabaseClient
        .from("profiles")
        .select("nickname,current_vr")
        .eq("id", SESSION.user.id)
        .maybeSingle();

      if (error && String(error.message || "").includes("column profiles.id")) {
        ({ data, error } = await supabaseClient
          .from("profiles")
          .select("nickname,current_vr")
          .eq("user_id", SESSION.user.id)
          .maybeSingle());
      }

      if (!error) window.PROFILE = data || null;
    }catch(e){ console.warn(e); }
  }

  if (typeof window.downloadTextFile !== "function") {
    window.downloadTextFile = function(filename, text){
      const blob = new Blob([text], { type: "application/json;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch{} a.remove(); }, 0);
    };
  }

  if (typeof window.exportBackupJSON !== "function") {
    window.exportBackupJSON = async function(){
      try{
        if (typeof window.setStatus === "function") window.setStatus("Creating backup…", true);
        await ensureSession();
        await ensureProfile();
        if (!window.SESSION?.user) throw new Error("Not signed in.");

        const allMatches = [];
        const chunk = 1000;
        let from = 0;

        while (true) {
          const to = from + chunk - 1;
          const { data, error } = await supabaseClient
            .from("matches")
            .select("id, created_at, intermission, track, vr_change, vr_after, opponents, placement")
            .eq("user_id", SESSION.user.id)
            .order("created_at", { ascending: true })
            .range(from, to);

          if (error) throw error;
          if (!data || data.length === 0) break;

          allMatches.push(...data);
          if (data.length < chunk) break;
          from += chunk;
        }

        const backup = {
          app: "MKWT",
          version: 1,
          exported_at: new Date().toISOString(),
          user: { id: SESSION.user.id, email: SESSION.user.email || null },
          profile: {
            nickname: window.PROFILE?.nickname ?? null,
            current_vr: window.PROFILE?.current_vr ?? null
          },
          matches: allMatches
        };

        const filename =
          `mkwt_backup_${String(window.PROFILE?.nickname || "user").replace(/\s+/g, "_")}_${new Date().toISOString().slice(0,10)}.json`;

        window.downloadTextFile(filename, JSON.stringify(backup, null, 2));
        if (typeof window.setStatus === "function") window.setStatus(`✅ Backup created (${allMatches.length} matches).`, true);
      } catch(e){
        if (typeof window.setStatus === "function") window.setStatus("Backup failed: " + (e?.message || e), false);
        if (typeof window.setDebug === "function") window.setDebug(e?.stack || String(e));
        console.error(e);
      }
    };
  }

  
  // --- Shared backup fingerprint (used to avoid duplicates + enable full restore) ---
  function fingerprintMatch(r) {
    const created = r && r.created_at ? String(r.created_at) : "";
    return [
      created,
      String(r?.intermission ?? ""),
      String(r?.track ?? ""),
      String(r?.vr_change ?? ""),
      String(r?.opponents ?? ""),
      String(r?.placement ?? "")
    ].join("|");
  }

  async function syncProfileVrFromLatestMatch(){
    try{
      const { data, error } = await supabaseClient
        .from("matches")
        .select("vr_after, created_at")
        .eq("user_id", SESSION.user.id)
        .order("created_at", { ascending: false })
        .limit(1);

      if (error) throw error;

      const latest = (data && data[0]) ? data[0] : null;
      const latestVr = Number(latest?.vr_after);
      if (!Number.isFinite(latestVr)) return false;

      const { error: upErr } = await supabaseClient
        .from("profiles")
        .update({ current_vr: latestVr, updated_at: new Date().toISOString() })
        .eq("id", SESSION.user.id);

      if (upErr) throw upErr;
      if (window.PROFILE) window.PROFILE.current_vr = latestVr;
      return true;
    } catch(e){
      if (typeof window.setDebug === "function") window.setDebug("syncProfileVrFromLatestMatch error: " + (e?.message || e));
      return false;
    }
  }

  // IMPORTANT: Import is a TRUE RESTORE.
  // - Deletes everything not in the backup
  // - Removes duplicates (keeps 1 per fingerprint)
  // - Inserts what's missing
  window.importBackupJSON = async function(file){
    try{
      if (!file) return;

      await ensureSession();
      if (!window.SESSION?.user) throw new Error("Not logged in.");

      const text = await file.text();
      const backup = JSON.parse(text);

      if (!backup || backup.app !== "MKWT" || !Array.isArray(backup.matches)) {
        if (typeof window.setStatus === "function") window.setStatus("❌ This file isn't a valid MKWT backup.", false);
        return;
      }

      // Deduplicate backup by fingerprint (keep first occurrence in chronological order)
      const sortedBackup = [...backup.matches].sort((a,b)=> String(a?.created_at||"").localeCompare(String(b?.created_at||"")));
      const uniqueBackup = [];
      const backupFp = new Set();
      for (const r of sortedBackup) {
        const fp = fingerprintMatch(r);
        if (!backupFp.has(fp)) { backupFp.add(fp); uniqueBackup.push(r); }
      }

      const ok = confirm(
        `Restore from backup?

` +
        `Matches in file: ${uniqueBackup.length}

` +
        `This will make your match history EXACTLY match the backup.
` +
        `All matches NOT in the backup will be deleted.`
      );
      if (!ok) return;

      if (typeof window.setStatus === "function") window.setStatus("Restoring… (delete + dedupe + insert)", true);

      // --- Load all existing matches (IDs for deletes). Also mark duplicates for delete ---
      const existingKeepFp = new Set();
      const toDeleteIds = [];
      const chunk = 1000;
      let from = 0;

      while (true) {
        const to = from + chunk - 1;
        const { data, error } = await supabaseClient
          .from("matches")
          .select("id, created_at, intermission, track, vr_change, opponents, placement")
          .eq("user_id", SESSION.user.id)
          .range(from, to);

        if (error) throw error;
        if (!data || data.length === 0) break;

        for (const row of data) {
          const fp = fingerprintMatch(row);

          // delete if not in backup
          if (!backupFp.has(fp)) {
            toDeleteIds.push(row.id);
            continue;
          }

          // if duplicate (same fingerprint already kept), delete
          if (existingKeepFp.has(fp)) {
            toDeleteIds.push(row.id);
            continue;
          }

          existingKeepFp.add(fp);
        }

        if (data.length < chunk) break;
        from += chunk;
      }

      // --- Delete extras + rows not in backup ---
      let deleted = 0;
      const delBatchSize = 500;
      for (let i = 0; i < toDeleteIds.length; i += delBatchSize) {
        const batchIds = toDeleteIds.slice(i, i + delBatchSize);
        const { error } = await supabaseClient.from("matches").delete().in("id", batchIds);
        if (error) throw error;
        deleted += batchIds.length;
      }

      // --- Insert missing rows (only fingerprints not already kept) ---
      const toInsert = [];
      for (const r of uniqueBackup) {
        const fp = fingerprintMatch(r);
        if (!existingKeepFp.has(fp)) {
          toInsert.push({
            user_id: SESSION.user.id,
            created_at: r.created_at,
            intermission: r.intermission ?? null,
            track: r.track ?? null,
            vr_change: r.vr_change ?? 0,
            vr_after: r.vr_after ?? null,
            opponents: r.opponents ?? null,
            placement: r.placement ?? null,
          });
          existingKeepFp.add(fp);
        }
      }

      let inserted = 0;
      const insBatchSize = 500;
      for (let i = 0; i < toInsert.length; i += insBatchSize) {
        const batch = toInsert.slice(i, i + insBatchSize);
        const { error } = await supabaseClient.from("matches").insert(batch);
        if (error) throw error;
        inserted += batch.length;
      }

      await syncProfileVrFromLatestMatch();

      if (typeof window.setStatus === "function") window.setStatus(
        `✅ Restore complete. Backup: ${uniqueBackup.length} | Deleted: ${deleted} | Inserted: ${inserted}. Reloading…`,
        true
      );
      setTimeout(()=>location.reload(), 350);
    } catch(e){
      if (typeof window.setStatus === "function") window.setStatus("Import failed: " + (e?.message || e), false);
      if (typeof window.setDebug === "function") window.setDebug(e?.stack || String(e));
      console.error(e);
    }
  };
function wireNav(){
    const btnExport = $id("btnExport");
    const btnLogout = $id("btnLogout");
    const fileImport = $id("fileImport");

    function clearSupabaseTokens(storage){
      try{
        const keys = [];
        for(let i=0;i<storage.length;i++){
          const k = storage.key(i);
          if(!k) continue;
          if(k.startsWith("sb-") && k.includes("auth-token")) keys.push(k);
          if(k === "mkwt_post_login_redirect") keys.push(k);
        }
        keys.forEach(k=>{ try{ storage.removeItem(k); }catch{} });
      }catch{}
    }

    async function hardLogout(){
      // Sign out of BOTH storage-backed clients (local + session), otherwise login.html may auto-redirect.
      try{ await clientLocal?.auth?.signOut?.(); }catch(e){ console.warn(e); }
      try{ await clientSess?.auth?.signOut?.(); }catch(e){ console.warn(e); }
      try{ await window.supabaseClient?.auth?.signOut?.(); }catch(e){ console.warn(e); }
      clearSupabaseTokens(localStorage);
      clearSupabaseTokens(sessionStorage);
      location.replace("login.html");
    }

    // Remove any legacy inline handlers so we don't double-fire alerts/old logic.
    if (btnExport) btnExport.onclick = null;
    if (btnLogout) btnLogout.onclick = null;
    if (fileImport) fileImport.onchange = null;

    btnExport?.addEventListener("click", () => window.exportBackupJSON());
    fileImport?.addEventListener("change", (ev) => {
      const file = ev.target.files?.[0];
      if (file) window.importBackupJSON(file);
      ev.target.value = "";
    });
    btnLogout?.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      hardLogout();
    }, { capture: true });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wireNav);
  else wireNav();
})();
</script>
</body>
</html>
