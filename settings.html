<div class="wrap">

<div class="card">
  <div class="topbar">
    <div>
      <h2 class="mb-0" style="margin-bottom:6px;">MKWT – Settings</h2>
      <div class="muted" id="userInfo">Loading session…</div>
      <div class="muted">Current VR (Profile): <b id="currentVr">–</b></div>
      <div class="muted">Matches: <b id="matchCount">–</b></div>
    </div>
  </div>
  <div class="muted" data-status="shared" id="statusTop"></div>
</div>

<div class="card">
<h2>Settings</h2>
<div class="row">
<div class="field">
<label class="muted">Nickname</label>
<input id="settingsNickname"/>
</div>
<div class="field">
<label class="muted">Current VR</label>
<input id="settingsVr" type="number"/>
</div>
</div>
<div class="row mt-10">
  <div class="field flex-1">
    <div class="row-inline">
      <label for="settingsTheme" class="muted m-0">Theme</label>
      <button aria-label="Info" class="mcard__infoBtn" data-info="theme" title="Info" type="button">i</button>
    </div>
    <select id="settingsTheme">
      <option value="dark">Midnight Matte</option>
      <option value="light">Soft Snow</option>
      <option value="dendo">Dendo Denim</option>
      <option value="green">Green Gleam</option>
      <option value="red">Red Ruby</option>
      <option value="purple">Purple Pop</option>
      <option value="rose">Rose Rime</option>
    </select>
    <div class="muted" id="themeHelp" class="hint"></div>
  </div>
</div>

<div class="row mt-10">
<div class="field flex-1">
  <div class="row-inline">
    <label for="settingsMinVr" class="muted m-0">Exclude low-VR matches from stats</label>
    <button aria-label="Info" class="mcard__infoBtn" data-info="minVrFilter" title="Info" type="button">i</button>
  </div>
<div class="row-inline--gap10">
<span class="muted" style="opacity:.85;">&lt;</span>
<input id="settingsMinVr" inputmode="numeric" placeholder="0" style="flex:1;" type="number"/>
</div>
</div>
</div>
<div class="mt-12">
<button class="btn" id="btnSaveSettings">Save</button>
</div>

<hr class="divider"/>

<div class="section-header">
  <h3 class="m-0">Account</h3>
  <button aria-label="Info" class="mcard__infoBtn" data-info="account" title="Info" type="button">i</button>
</div>
<div class="muted" style="font-size:12px; opacity:.85; margin-bottom:10px;"></div>
<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px;">
  <button class="btn2" id="btnChangePassword" type="button">Change password</button>
  <button class="btn" id="btnLogout" type="button" style="display:none">Logout</button>
  <div class="muted" style="font-size:12px; opacity:.85;"></div>
</div>

<hr class="divider"/>
<div class="section-header">
  <h3 class="m-0">Contact</h3>
  <button aria-label="Info" class="mcard__infoBtn" data-info="contact" title="Info" type="button">i</button>
</div>

<a class="btn2 discordBtn" href="https://discord.com/users/335049995055267840" target="_blank" rel="noopener noreferrer">

    <svg viewBox="0 0 245 240" focusable="false">

<hr class="divider"/>
<h3 style="margin:0 0 10px 0;">Data</h3>
<div style="display:flex; gap:10px; flex-wrap:wrap;">
<button class="btn2" id="btnExport" type="button">Export</button>
<label class="btn2" style="cursor:pointer;">
        Import
        <input accept="application/json" id="fileImport" style="display:none;" type="file"/>
</label>
</div>
<div class="muted" data-status="shared" id="statusData"></div>
</div>
</div>

<!-- Change Password Modal -->
<div class="infoOverlay" hidden id="pwOverlay">
  <div class="infoPanel" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <div class="infoHeader">
      <div class="infoTitle" id="pwTitle">Change password</div>
      <button class="mcard__infoBtn" id="pwClose" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <div class="infoBody">
      <div class="field" style="margin-bottom:10px;">
        <label class="muted">New password</label>
        <input id="pwNew" type="password" autocomplete="new-password" placeholder="••••••••" />
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label class="muted">Confirm password</label>
        <input id="pwConfirmInput" type="password" autocomplete="new-password" placeholder="••••••••" />
      </div>
      <div class="muted" id="pwStatus" style="min-height:18px; margin-bottom:12px;"></div>
      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
        <button class="btn2" id="pwCancel" type="button">Cancel</button>
        <button class="btn" id="pwConfirm" type="button">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- Reusable Info Modal -->
<div class="infoOverlay" hidden="" id="infoOverlay">
<div aria-labelledby="infoTitle" aria-modal="true" class="infoPanel" role="dialog">
<div class="infoHeader">
<div class="infoTitle" id="infoTitle">Info</div>
<button aria-label="Close" class="mcard__infoBtn" id="infoClose" title="Close" type="button">×</button>
</div>
<div class="infoBody" id="infoBody"></div>
</div>
</div>

<script src="mkwt_public.js"></script>
<script src="settings.js"></script>
