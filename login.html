<!DOCTYPE html>

<html lang="en">
<head>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#07080a"/>
<meta charset="utf-8"/><script>(function(){try{var t=localStorage.getItem('mkwt_theme')||'dark';document.documentElement.dataset.theme=t;var c=(t==='light')?'#f3f4f6':(t==='rose')?'#f7f0f4':(t==='purple')?'#05060a':(t==='green')?'#05060a':(t==='red')?'#05060a':(t==='dendo')?'#05060a':'#07080a';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c);}catch(e){}})();</script>
<title>MKWT – Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Login uses the same theme/button system as the rest of the app */
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}

  .loginCard{
    width:min(92vw,420px);
    padding:20px;
    border-radius:14px;
  }
  .logo{
    text-align:center;
    font-weight:900;
    letter-spacing:4px;
    font-size:26px;
    margin:2px 0 10px 0;
  }
  h2{ text-align:center; margin:0 0 16px 0; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label{ font-weight:800; color:var(--muted); font-size:13px; }

  .rememberRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin:12px 0 14px 0;
    flex-wrap:nowrap;
  }
  .rememberRow input[type="checkbox"]{
    width:18px;height:18px;
    accent-color: var(--primary);
    flex:0 0 auto;
  }
  .rememberRow label{
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    font-weight:800;
    color:var(--text);
  }

  .btnWide{ width:100%; height:44px; }

  .status{ margin-top:12px; text-align:center; font-size:13px; color:var(--muted); }
</style>
<link href="mkwt_theme_v3.css" rel="stylesheet"/>
<link href="mkwt_shared.css" rel="stylesheet"/>
</head>
<body>
<div class="login-wrap">
<div class="card loginCard">
<div class="logo">MKWT</div>
<h2>Sign In</h2>
<div class="field">
<label>Email</label>
<input autocomplete="email" id="email" type="email"/>
</div>
<div class="field">
<label>Password</label>
<input autocomplete="current-password" id="password" type="password"/>
</div>
<div class="rememberRow">
  <input id="remember" type="checkbox"/>
  <label for="remember">Stay signed in</label>
</div>

<button class="btn btnWide" id="btnLogin">Sign In</button>
<div class="status" id="status"></div>
</div>
</div>
<script>
/* ===== SUPABASE (IDENTICAL to tracker.html) ===== */
const SUPABASE_URL  = "https://imxlssgtzzdfgdscubdx.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlteGxzc2d0enpkZmdkc2N1YmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxMjI2NDYsImV4cCI6MjA4MzY5ODY0Nn0.b5nRQ1ryAC4_TMrmC5qIXx7Gm2hDzrR51Z6RVks2Wg4";

function makeClient(storage){
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth:{ storage, persistSession:true }
  });
}

const clientLocal = makeClient(localStorage);
const clientSess  = makeClient(sessionStorage);

const $ = id => document.getElementById(id);
const status = $("status");

// ✅ SET THIS to your real tracker file (b.html, tracker.html, etc.)
const TRACKER_PAGE = "tracker.html";
const REDIRECT_KEY = "mkwt_post_login_redirect";

function getPostLoginTarget(){
  try{
    const url = new URL(location.href);
    const qp = url.searchParams.get("next");
    if(qp && /^[a-z0-9_\-]+\.html$/i.test(qp)) return qp;
  }catch{}
  try{
    const stored = localStorage.getItem(REDIRECT_KEY);
    if(stored && /^[a-z0-9_\-]+\.html$/i.test(stored)) return stored;
  }catch{}
  return TRACKER_PAGE;
}

function clearPostLoginTarget(){
  try{ localStorage.removeItem(REDIRECT_KEY); }catch{}
}

/* ===== AUTO-REDIRECT if already signed in ===== */
async function autoRedirectIfSignedIn(){
  try{
    status.textContent = "Checking session…";

    let hasNext = false;
    try { const u = new URL(location.href); hasNext = u.searchParams.has("next"); } catch {}
    if (hasNext) { status.textContent = ""; return; }

    const { data: a, error: ea } = await clientLocal.auth.getSession();
    if(ea) console.warn("local session check:", ea.message);
    if(a?.session){
      const dest = getPostLoginTarget();
      clearPostLoginTarget();
      location.replace(dest);
      return;
    }

    const { data: b, error: eb } = await clientSess.auth.getSession();
    if(eb) console.warn("session session check:", eb.message);
    if(b?.session){
      const dest = getPostLoginTarget();
      clearPostLoginTarget();
      location.replace(dest);
      return;
    }

    status.textContent = "";
  } catch(err){
    console.warn(err);
    status.textContent = "";
  }
}

/* ===== LOGIN ===== */
$("btnLogin").onclick = async () => {
  status.textContent = "Signing in…";

  const email = $("email").value.trim();
  const password = $("password").value;
  const remember = $("remember").checked;

  if(!email || !password){
    status.textContent = "Please enter email and password";
    return;
  }

  const client = remember ? clientLocal : clientSess;

  const { error } = await client.auth.signInWithPassword({ email, password });

  if(error){
    status.textContent = error.message;
    return;
  }

  const dest = getPostLoginTarget();
  clearPostLoginTarget();
  location.replace(dest);
};

// run on load
autoRedirectIfSignedIn();
</script>
</body>
</html>
