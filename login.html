<body>
<noscript><div class="noscriptNotice"><h2>MKWT requires JavaScript</h2><p>Please enable JavaScript or disable your adblocker for this site.</p></div></noscript>
  <main class="page">
    <div class="loginCard card">
      <div class="logo"><span class="brand">MKWT <span class="byAytee">by Aytee</span></span></div>
      <h2>Login</h2>

      <div class="muted mutedCenterNote">
        VIP accounts are invite-only. You can also continue as Guest.
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Username or email</label>
          <input id="email" type="text" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>

        <div class="rememberRow">
          <label class="checkWrap" for="stay">
            <input id="stay" type="checkbox" />
            <span class="checkUI" aria-hidden="true"></span>
            <span class="checkLabel">Stay signed in</span>
          </label>
        </div>

        <div class="actionsRow actionsRow--mt14">
          <button class="btn actionGrow160" id="btnLogin" type="submit">Log in</button>
          <button class="btn2 actionGrow160" id="btnGuest" type="button">Continue as Guest</button>
        </div>
      </form>

      <div class="muted statusSpace" id="status"></div>
    </div>
  </main>

  

<script src="mkwt_public.js"></script>
<script src="login.js"></script>
</body>
</html>
