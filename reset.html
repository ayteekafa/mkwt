<head>
  <meta charset="utf-8"/>

  <title>MKWT - Reset Password</title>

  <script src="mkwt_page_helpers.js"></script>
<link href="mkwt_theme_v3.css" rel="stylesheet"/>
  <link href="reset.css" rel="stylesheet"/>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="description" content="MKWT is an online Mario Kart World match tracker. Track VR, sessions, and intermission routes, and see which tracks you perform best on as you improve over time.">
  
  <meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.mkwt.app/reset.html">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="MKWT - Mario Kart World Match Tracker">
  <meta property="og:description" content="MKWT is an online Mario Kart World match tracker. Track VR, sessions, and intermission routes, and see which tracks you perform best on as you improve over time.">
  <meta property="og:image" content="https://www.mkwt.app/og-card.png">
  <meta property="og:url" content="https://www.mkwt.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MKWT - Mario Kart World Match Tracker">
  <meta name="twitter:description" content="MKWT is an online Mario Kart World match tracker. Track VR, sessions, and intermission routes, and see which tracks you perform best on as you improve over time.">

</head>
<body>
<noscript><div class="noscriptNotice"><h2>MKWT requires JavaScript</h2><p>Please enable JavaScript or disable your adblocker for this site.</p></div></noscript>
  <main class="cardWrap">
    <div class="card resetCard">
      <div class="logo">MKWT</div>
      <h2>Set a new password</h2>

      <form id="resetForm">
        <input class="visuallyHiddenInput" type="email" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" />
        <div class="field">
          <label for="p1">New password</label>
          <input id="p1" type="password" autocomplete="new-password" placeholder="........"/>
        </div>
        <div class="field">
          <label for="p2">Confirm new password</label>
          <input id="p2" type="password" autocomplete="new-password" placeholder="........"/>
        </div>

        <button class="btn btnWide" id="btnSet" type="submit">Update password</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </main>

  

<script src="mkwt_public.js"></script>
<script src="reset.js"></script>
</body>
</html>
