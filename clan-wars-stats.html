<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="mkwt_bootstrap.js"></script>
  <title>MKWT - Clan Wars Stats</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b111f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="mkwt_core.js"></script>
  <script src="mkwt_page_helpers.js"></script>
  <link href="mkwt_theme_v3.css" rel="stylesheet"/>
  <link href="stats.css" rel="stylesheet"/>
  <link href="mkcentral.css" rel="stylesheet"/>
  <link href="clan-wars.css" rel="stylesheet"/>
</head>
<body>
  <nav class="nav">
    <div class="navInner">
      <div class="brand">MKWT <span class="byAytee">by Aytee</span></div>
      <div class="navDropdown">
        <button class="navLink navDropTrigger" type="button" aria-haspopup="true" aria-expanded="false">Tracker</button>
        <div class="navDropdownMenu">
          <a class="navDropdownItem" href="tracker.html">World Wides</a>
          <a class="navDropdownItem" href="lounge.html">Lounge 12p</a>
          <a class="navDropdownItem" href="lounge-24.html">Lounge 24p</a>
          <a class="navDropdownItem" href="time-trial.html">Time Trial</a>
          <a class="navDropdownItem" href="clan-wars.html">Clan Wars</a>
        </div>
      </div>
      <div class="navDropdown">
        <button class="navLink navDropTrigger active" type="button" aria-haspopup="true" aria-expanded="false">Stats</button>
        <div class="navDropdownMenu">
          <a class="navDropdownItem" href="stats.html">World Wide Stats</a>
          <a class="navDropdownItem" href="lounge-stats.html">Lounge Stats</a>
          <a class="navDropdownItem active" href="clan-wars-stats.html">Clan Wars Stats</a>
        </div>
      </div>
      <div class="navDropdown">
        <button class="navLink navDropTrigger" type="button" aria-haspopup="true" aria-expanded="false">Race Lab</button>
        <div class="navDropdownMenu">
          <a class="navDropdownItem" href="combo-builder.html">Combo Builder</a>
          <a class="navDropdownItem" href="item-distribution.html">Item Distribution</a>
        </div>
      </div>
      <a aria-label="Settings" class="navLink navIcon" href="settings.html" title="Settings">&#9881;</a>
    </div>
  </nav>

  <main class="wrap mkcWrap clanWarsStatsWrap">
    <section class="card profileCard mkcHero mkcHeroUnified clanWarsStatsHero">
      <div class="profileTop mkcHeroTop">
        <div class="mkcHeroCopy">
          <p class="eyebrow">Stats</p>
          <h2 class="heroTitle mkcHeroTitle"><span>Clan Wars Stats</span></h2>
        </div>
      </div>
    </section>

    <section class="card mkcToolbarCard clanWarsStatsToolbar" aria-labelledby="cwStatsToolbarTitle">
      <div class="mkcToolbarMain">
        <div class="mkcToolbarCopy">
          <h3 class="mkcToolbarTitle" id="cwStatsToolbarTitle">Clan Wars Overview</h3>
          <div class="mkcToolbarMetrics clanWarsStatsTopMetrics" aria-label="Clan Wars summary">
            <div class="mkcToolbarMetric">
              <span>Matches</span>
              <strong id="cwStatsMatches">0</strong>
            </div>
            <div class="mkcToolbarMetric">
              <span>Races</span>
              <strong id="cwStatsTrackCount">0</strong>
            </div>
          </div>
          <div class="mkcTrackerInsight clanWarsStatsTrackHighlights" aria-label="Clan Wars track highlights">
            <div class="clanWarsStatsTrackHighlight">
              <span class="mkcTrackerInsightLabel">Best Track</span>
              <div class="mkcTrackerInsightTitle" id="cwStatsBest">-</div>
              <span class="mkcTrackerInsightMeta" id="cwStatsBestMeta"></span>
            </div>
            <div class="clanWarsStatsTrackHighlight">
              <span class="mkcTrackerInsightLabel">Worst Track</span>
              <div class="mkcTrackerInsightTitle" id="cwStatsWorst">-</div>
              <span class="mkcTrackerInsightMeta" id="cwStatsWorstMeta"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card mkcTrackerChartsSection clanWarsStatsDeckSection">
      <div class="sectionHead mkcTrackerChartsHead">
        <div>
          <h3>Clan Wars Charts</h3>
        </div>
        <div class="mkcTrackerChartActions">
          <div class="modeToggle mkcTrackerModeToggle clanWarsStatsEventToggle" aria-label="Clan Wars event type">
            <button class="modeBtn isActive active" data-cw-stats-event="6v6" type="button">6v6</button>
            <button class="modeBtn" data-cw-stats-event="6v6v6v6" type="button">6v18</button>
          </div>
        </div>
      </div>

      <div class="mkcTrackerChartsGrid">
        <div class="card mkcTrackerChartCard mkcLoungeDeckCard clanWarsStatsChartCard">
          <div class="mkcTrackerChartHead">
            <div>
              <div class="mkcChartTitleLine">
                <h4 id="cwStatsDeckTitle">Track Performance</h4>
              </div>
            </div>
            <div class="mkcTrackerChartActions clanWarsStatsChartActions">
              <div class="mkcTrackerFilter" id="cwStatsSortFilterRoot">
                <button aria-controls="menuCwStatsSortFilter" aria-expanded="false" aria-haspopup="true" class="mkcTrackerFilterBtn" id="btnCwStatsSortFilter" type="button">
                  <span class="mkcTrackerFilterGlyph" aria-hidden="true"><span></span><span></span><span></span></span>
                  <span id="cwStatsSortFilterValue">Performance v</span>
                </button>
                <div class="mkcTrackerFilterMenu" hidden id="menuCwStatsSortFilter">
                  <button class="mkcTrackerFilterItem active" data-cw-stats-sort="avg" type="button"><span>Performance</span><span class="mkcTrackerFilterMeta">v</span></button>
                  <button class="mkcTrackerFilterItem" data-cw-stats-sort="count" type="button"><span>Most played</span><span class="mkcTrackerFilterMeta"></span></button>
                </div>
              </div>
              <div class="mkcTrackerFilter" hidden id="cwStatsDivisionFilterRoot">
                <button aria-controls="menuCwStatsDivisionFilter" aria-expanded="false" aria-haspopup="true" class="mkcTrackerFilterBtn" id="btnCwStatsDivisionFilter" type="button">
                  <span class="mkcTrackerFilterGlyph" aria-hidden="true"><span></span><span></span><span></span></span>
                  <span id="cwStatsDivisionFilterValue">All divisions</span>
                </button>
                <div class="mkcTrackerFilterMenu clanWarsStatsDivisionMenu" hidden id="menuCwStatsDivisionFilter"></div>
              </div>
            </div>
          </div>
          <div class="mkcChartSwipeViewport" id="cwStatsDeckViewport">
            <div class="mkcChartSwipeTrack" id="cwStatsDeckTrack">
              <section class="mkcChartSwipePanel" data-cw-stats-panel="performance">
                <div class="mkcChartWrap mkcChartWrapTracker"><canvas id="chartCwStatsPerformance"></canvas></div>
                <div class="mkcTrackerInsight" id="cwStatsPerformanceInsight" hidden></div>
              </section>
              <section class="mkcChartSwipePanel" data-cw-stats-panel="placement">
                <div class="mkcChartWrap mkcChartWrapTracker"><canvas id="chartCwStatsPlacement"></canvas></div>
                <div class="mkcTrackerInsight" id="cwStatsPlacementInsight" hidden></div>
              </section>
            </div>
          </div>
          <div class="chartPager chartPager--perf" id="cwStatsDeckPager">
            <button aria-label="Show track performance" class="chartPagerBtn active" data-cw-stats-chart-mode="tracks" type="button">Tracks</button>
            <button aria-label="Show destiny performance" class="chartPagerBtn" data-cw-stats-chart-mode="im_destiny" type="button">Destiny</button>
            <button aria-label="Show special destiny performance" class="chartPagerBtn" data-cw-stats-chart-mode="im_special_destiny" type="button">Special</button>
            <button aria-label="Show separated route performance" class="chartPagerBtn" data-cw-stats-chart-mode="im_routes" type="button">Separated</button>
            <button aria-label="Show placement distribution" class="chartPagerBtn" data-cw-stats-chart-mode="placement" type="button">Placement</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="mkwt_public.js"></script>
  <script src="clan-wars-stats.js"></script>
</body>
</html>
